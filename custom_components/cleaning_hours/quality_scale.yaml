rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: exempt
    comment: No polling; entities update from the tracker via the dispatcher.
  brands:
    status: exempt
    comment: Custom integration; no brand assets in home-assistant/brands.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: exempt
    comment: No external requirements.
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: exempt
    comment: No connection to test; inputs are existing Home Assistant entities and services, the notify service is validated.
  test-before-setup:
    status: exempt
    comment: Nothing external to reach at setup; data comes from the recorder on each scan.
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable:
    status: exempt
    comment: No device or service connection that can become unavailable.
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: No authentication.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: Nothing to discover; it is a calculated service.
  discovery-update-info:
    status: exempt
    comment: Nothing to discover.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: Exactly one service device.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: Every entity is needed for the review workflow.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: No situation needs user action outside the normal review flow.
  stale-devices:
    status: exempt
    comment: Exactly one service device, removed with the config entry.

  # Platinum
  async-dependency:
    status: exempt
    comment: No external library.
  inject-websession:
    status: exempt
    comment: No HTTP client of its own.
  strict-typing: done
