[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components.cleaning_hours"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.mypy]
strict = true
python_version = "3.14"
files = ["custom_components/cleaning_hours"]

[[tool.mypy.overrides]]
module = ["probatio"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py314"
