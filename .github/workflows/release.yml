name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Own token, not GITHUB_TOKEN: PRs opened with GITHUB_TOKEN don't trigger the required checks.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
